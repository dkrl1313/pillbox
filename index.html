<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf7f5">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1b1716">
<title>약통</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="약통">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💊%3C/text%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light dark;
  --bg: #faf7f5; --card: #fff; --ink: #2b2523; --muted: #756a65; --line: #ebe3de;
  --accent: #a94f43; --on-accent: #fff; --soft: #f6e9e5;
  --warn: #8a5300; --warn-bg: #fdf0d5; --bad: #b3261e; --bad-bg: #fde8e6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1716; --card: #262120; --ink: #f2eae7; --muted: #a99d98; --line: #3a322f;
    --accent: #e8a094; --on-accent: #2a1410; --soft: #3a2824;
    --warn: #ffd08a; --warn-bg: #3e2f12; --bad: #ffb4ab; --bad-bg: #4b1f1b;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0 auto; max-width: 560px; min-height: 100dvh; background: var(--bg); color: var(--ink);
  padding: 0 16px calc(80px + env(safe-area-inset-bottom));
  font: 16px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  word-break: keep-all; overflow-wrap: anywhere;
}
h1 { font-size: 20px; margin: 0; letter-spacing: -.02em; margin-right: auto; }
h2 { font-size: 16px; margin: 0 0 4px; }
p { margin: 0; }
small, .muted { color: var(--muted); font-size: 13px; font-weight: 400; }
button, select, input, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }        /* display 를 준 카드(.prod 등)도 hidden 이면 숨긴다 */
button { cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 14px; min-height: 40px; }
button:disabled { opacity: .35; cursor: default; }
.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.danger { color: var(--bad); border-color: transparent; background: none; }
.wide { width: 100%; min-height: 48px; margin-bottom: 12px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: flex; align-items: center; gap: 10px; padding: 12px 0 8px; }
header button { border: 0; background: none; font-size: 22px; min-width: 44px; min-height: 44px; padding: 0; }
nav {
  position: fixed; inset: auto 0 0 0; margin: 0 auto; max-width: 560px; display: grid; grid-template-columns: repeat(2, 1fr);
  background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom);
}
nav button { border: 0; border-radius: 0; background: none; min-height: 56px; color: var(--muted); font-size: 14px; }
nav button[aria-current] { color: var(--accent); font-weight: 700; }
.count { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 5px; border-radius: 9px; background: #b3261e; color: #fff; font-size: 11px; line-height: 18px; font-weight: 700; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; }
.tag { flex: none; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.tag.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.tag.on { background: var(--soft); color: var(--accent); border-color: transparent; }
.tag.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.secret { -webkit-text-security: disc; }     /* 비밀번호 칸으로 두면 비밀번호 관리자가 키를 저장하려 든다 */
.ai { margin: 0; background: var(--soft); border-radius: 12px; padding: 10px 14px; font-size: 14px; }
.note { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 10px 14px; font-size: 14px; margin-bottom: 10px; }
.note button { display: block; margin-top: 8px; }
.note summary { cursor: pointer; }
.note details span { display: block; margin-top: 6px; }
.empty { text-align: center; padding: 40px 12px; display: grid; gap: 10px; justify-items: center; color: var(--muted); }
.empty b { color: var(--ink); font-size: 17px; }
.chip { min-height: 34px; padding: 4px 12px; border-radius: 999px; font-size: 13px; color: var(--muted); }
.filters .chip[aria-pressed=true] { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 700; }
.search { margin-bottom: 10px; }

/* 오늘 */
.alts { list-style: none; margin: 0; padding: 0; }
.alts li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.alts li:first-child { border-top: 0; }
.check li { align-items: flex-start; }      /* 검토 항목은 여러 줄이라 위로 맞춘다 */
.what { flex: 1; min-width: 0; display: grid; }
button.what { border: 0; background: none; padding: 2px 0; min-height: 0; border-radius: 6px; text-align: left; }      /* 눌러서 제품 창 */
.what .memo { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }      /* 메모는 한 줄로 (전체는 제품 창에서) */
.what b { font-weight: 600; }
.tick { flex: none; width: 40px; min-height: 40px; padding: 0; border-radius: 50%; color: var(--line); font-weight: 700; }      /* 먹었어요 체크 */
.tick[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.alts li:has(.tick[aria-pressed=true]) .what { opacity: .5; }

/* 약통 */
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.prod { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; }
.prod .name { border: 0; background: none; padding: 4px 0; min-height: 0; text-align: left; font-weight: 600; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.what .for { margin-top: 6px; color: var(--ink); font-weight: 700; }
.acts button { min-height: 32px; padding: 4px 10px; font-size: 13px; }

/* 입력 창 */
dialog { border: 0; border-radius: 18px; padding: 20px; width: min(100vw - 24px, 480px); max-height: calc(100dvh - 24px); background: var(--card); color: var(--ink); }
dialog::backdrop { background: rgb(0 0 0 / .5); }
form { display: grid; gap: 14px; }
form > label, .two label { display: grid; gap: 5px; font-size: 13px; color: var(--muted); }
.more summary { padding: 11px 0; font-size: 14px; color: var(--muted); cursor: pointer; }
.help summary { padding: 2px 0; font-size: 13px; color: var(--muted); cursor: pointer; list-style: none; }
.help summary::-webkit-details-marker { display: none; }
.help summary::after { content: ' ⓘ'; }
.help small { display: block; margin-top: 4px; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
input:not([type=checkbox], [type=radio]), select, textarea { width: 100%; min-height: 44px; padding: 9px 12px; font-size: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
textarea { resize: vertical; }
input[type=checkbox] { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
.checks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
form > label.pill, label.pill { display: inline-flex; align-items: center; gap: 6px; justify-self: start; min-height: 38px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 14px; color: var(--ink); cursor: pointer; }
label.pill:has(:checked) { background: var(--soft); border-color: transparent; color: var(--accent); font-weight: 700; }
.autonote, .stocknote { display: block; margin-top: 6px; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px 10px; }
.actions { display: flex; gap: 8px; align-items: center; }
.grow { flex: 1; }
form > label.btn, .btn { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; color: var(--ink); cursor: pointer; }
.btn:has(:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }      /* 창이 열릴 때 자동 초점엔 안 뜨고 키보드로 옮겼을 때만 */
.btn:has(:disabled) { opacity: .35; pointer-events: none; }
.sr, input.sr { position: absolute; width: 1px; height: 1px; min-height: 0; padding: 0; border: 0; overflow: hidden; clip-path: inset(50%); }

#toast { inset: auto auto calc(72px + env(safe-area-inset-bottom)) 50%; translate: -50% 0; margin: 0; border: 0; padding: 10px 16px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 14px; max-width: calc(100vw - 32px); }
#toast.bad { background: #b3261e; color: #fff; }
</style>
</head>
<body>
<header>
  <h1>약통</h1>
  <button data-act="backup" aria-label="설정·백업" title="설정·백업">⋯</button>
</header>
<p id="twin" class="note" hidden>⚠ 약통이 다른 탭·창에도 열려 있어요. 저장이 막힐 수 있으니 하나만 남기고 닫아 주세요.</p>
<p id="lost" class="note" role="alert" hidden>⚠ 저장된 내용을 읽지 못했어요. 지금 고치는 것은 저장되지 않아요 — 새로고침해 주세요.</p>
<p id="stuck" class="note" role="alert" hidden>⚠ 저장이 끝나지 않고 있어요. 다른 탭·창에 열린 약통을 모두 닫아 주세요. 지금 새로고침하면 방금 고친 내용이 사라져요.</p>
<main id="view"></main>
<nav aria-label="화면">
  <button data-act="tab" data-tab="today">오늘</button>
  <button data-act="tab" data-tab="list">약통<span id="soon" class="count" hidden></span></button>
</nav>
<dialog id="dlg"></dialog>
<p id="toast" role="status" popover="manual"></p>

<script>
'use strict';

/* ───────── 기준값 ───────── */
// 시간대: 적힌 순서 = 하루 순서. [이름, 그림]
const SLOTS = { wake: ['아침 공복', '🌅'], am: ['아침 식후', '☀️'], noon: ['점심 식후', '🌤️'], pm: ['저녁 식후', '🌙'], bed: ['자기 전', '🛏️'] };
const SLOT_KEYS = Object.keys(SLOTS);
const KINDS = { multi: '종합비타민', vitamin: '비타민', mineral: '미네랄', probiotic: '유산균', omega: '오메가3·오일', herb: '허브·추출물', protein: '단백질·콜라겐', drink: '음료·샷', etc: '기타' };
// 성분 체크 — 자동 배치(RULES)와 안내(gaps)에 쓰는 것만. 제품의 전체 성분표가 아니다
const TAGS = { iron: '철분', calcium: '칼슘', magnesium: '마그네슘', zinc: '아연', b: '비타민B군', c: '비타민C', fat: '지용성', probiotic: '유산균', caffeine: '카페인' };
const MINERALS = ['calcium', 'magnesium', 'zinc'];      // 철분과 같은 때에 있으면 안내하는 성분
// 자동 루틴: 먹는 때를 직접 고르지 않은 제품은 위에서부터 처음 맞는 줄의 시간대 한 곳에 넣는다. [이름, 맞는가, 시간대]
// 흔히 권하는 일반적인 때일 뿐 — 제품 라벨의 섭취 방법이 다르면 사용자가 제품 창에서 직접 고른다. 줄을 고치면 AI 에 보내는 설명(APP_RULES)도 같이 바뀐다
const has = (p, t) => p.tags.includes(t);
const RULES = [
  ['유산균', p => p.kind === 'probiotic' || has(p, 'probiotic'), 'wake'],
  ['종합비타민', p => p.kind === 'multi', 'am'],
  ['철분', p => has(p, 'iron'), 'wake'],
  ['카페인', p => has(p, 'caffeine'), 'am'],      // 마그네슘·칼슘보다 먼저 — 카페인 든 제품을 자동으로 저녁·자기 전에 넣고 스스로 안내(gaps ②)를 띄우지 않게
  ['마그네슘', p => has(p, 'magnesium'), 'bed'],
  ['칼슘', p => has(p, 'calcium'), 'pm'],
  ['비타민B군', p => has(p, 'b'), 'am'],
  ['지용성(비타민D 등·오메가3)', p => has(p, 'fat') || p.kind === 'omega', 'pm'],
  ['비타민C', p => has(p, 'c'), 'noon'],
  ['아연', p => has(p, 'zinc'), 'pm'],
  ['그 밖(음료·샷 포함)', () => true, 'am'],
];
const SOON = 30;                              // 기한이 이 날수 안이면 '임박'
const BACKUP_EVERY = 14;                      // 마지막 백업이 이 날수만큼 지나면 오늘 화면에서 알린다
const LOW = 7;                                // 남은 양이 이 날수분 이하면 '곧 떨어짐'

/* ───────── 계산 (화면과 무관 — 점검: index.html?test) ───────── */
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
const local = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = local(s); d.setDate(d.getDate() + n); return ymd(d); };
function addMonths(s, n) {                    // 1/31 + 1개월 = 2월 말일 (다음 달로 넘치지 않게)
  const [y, m, d] = s.split('-').map(Number);
  return ymd(new Date(y, m - 1 + n, Math.min(d, new Date(y, m + n, 0).getDate())));
}

const left = (p, now) => (p.expiry ? daysBetween(now, p.expiry) : null);      // 남은 날 (기한 모르면 null)
const expired = (p, now) => (left(p, now) ?? 0) < 0;                          // 기한 당일까지는 먹는다
const nearEnd = (p, now) => (left(p, now) ?? Infinity) <= SOON;               // 임박·만료
// 이 제품이 들어가는 시간대 (기한은 보지 않는다 — routine 이 뺀다). 루틴에 안 넣음이면 없음, 직접 고른 때가 있으면 그대로(하루 두 번이면 둘), 없으면 RULES 의 처음 맞는 한 곳
const slotsOf = p => (p.off ? [] : p.when.length ? SLOT_KEYS.filter(t => p.when.includes(t)) : [RULES.find(([, fit]) => fit(p))[2]]);
// 오늘 루틴: { wake: [id…], am: […], … } — 기한 지난 제품은 뺀다. 시간대 안은 목록 순서
function routine(items, now) {
  const out = Object.fromEntries(SLOT_KEYS.map(t => [t, []]));
  for (const p of items) if (!expired(p, now)) for (const t of slotsOf(p)) out[t].push(p.id);
  return out;
}
// 남은 양(stock): "350ml"·"60정" 같은 글 한 칸. 1회 섭취량(dose)과 단위가 같으면 ✓ 할 때마다 줄이고 며칠분인지 센다 — 모르는 것은 세지 않는다
// 글 앞의 숫자(n)와 그 뒤 글(tail)·단위(u: 숫자 바로 뒤 글자들, 소문자). 숫자로 시작하지 않으면 null
// 천 단위 쉼표(1,000ml)는 읽고, 확실히 읽을 수 없는 모양은 null — 반 알(1/2정)·범위(1~2정)·이상한 점·쉼표(1.5.2, 12,5). 잘못 읽어 틀리게 세느니 세지 않는다
const qty = s => {
  const m = /^\s*(\d{1,3}(?:,\d{3})+|\d+)(\.\d+)?(?![\d.,]|\s*[\/~\-–]\s*\d)(.*)$/s.exec(typeof s === 'string' ? s : '');
  return m ? { n: +(m[1].replace(/,/g, '') + (m[2] ?? '')), tail: m[3], u: (/^\s*([a-zA-Z가-힣]+)/.exec(m[3])?.[1] ?? '').toLowerCase() } : null;
};
// 한 번에 줄어드는 양: 1회 섭취량과 남은 양이 둘 다 숫자로 시작하고 단위가 같을 때(한쪽에 단위가 없으면 같다고 본다) — 아니면 0
const perTake = p => { const a = qty(p.dose), b = qty(p.stock); return a && b && a.n > 0 && (!a.u || !b.u || a.u === b.u) ? a.n : 0; };
// 며칠분 남았나 = 남은 양 ÷ (한 번 양 × 하루 횟수). 모르면 null (양을 못 읽음 · 루틴에 없음 · 기한 지남)
const stockDays = (p, now) => { const per = perTake(p), times = expired(p, now) ? 0 : slotsOf(p).length; return per && times ? Math.floor(qty(p.stock).n / (per * times) + 1e-9) : null; };      // + 1e-9: 0.3 ÷ 0.1 이 2.999… 로 나와 하루 모자라게 세지 않게
// ✓ 하면 한 번 양만큼 줄이고(sign -1) 풀면 되돌린다(+1). 0 아래로는 안 내려간다. 숫자만 바꾸고 뒤의 글(단위 등)은 그대로
// ponytail: 되돌릴 때는 「지금」의 한 번 양을 더한다 — ✓ 한 뒤 섭취량을 고쳤거나 0 에 닿았다가 풀면 그만큼 어긋난다. 남은 양 칸을 직접 고치면 된다
function spend(p, sign) { const per = perTake(p); if (!per) return; const q = qty(p.stock); p.stock = `${Math.max(0, Math.round((q.n + sign * per) * 1000) / 1000)}${q.tail}`; }
const stockText = (p, now) => { const d = stockDays(p, now); return p.stock + (d === null ? '' : d ? ` · 약 ${d}일분` : ' · 다 떨어져 가요'); };
const backupDue = (s, now) =>!!s.items.length && (!s.backupAt || daysBetween(s.backupAt, now) >= BACKUP_EVERY);
// 오늘 화면 위의 안내: [짧은 글, 펼치는 설명, 버튼('' · soon = 임박·만료 보러 가기 · export = 백업)]. 글은 그대로 넣지 말고 화면에서 esc 한다(제품 이름이 들어 있음)
// backupAt 을 넘기지 않으면(undefined) 백업 알림은 보지 않는다
function gaps(items, now, backupAt) {
  const R = routine(items, now), byId = new Map(items.map(p => [p.id, p])), out = [];
  const names = ps => [...new Set(ps)].map(p => `‘${p.name}’`).join(', ');
  // ① 같은 때에 철분 제품과 칼슘·마그네슘·아연 제품(서로 다른 제품)
  const clash = SLOT_KEYS.map(t => {
    const ps = R[t].map(id => byId.get(id)), fe = ps.filter(p => has(p, 'iron')), mi = ps.filter(p => MINERALS.some(m => has(p, m)));
    return fe.some(a => mi.some(b => b !== a)) ? `${SLOTS[t][0]}: ${names([...fe, ...mi])}` : '';
  }).filter(Boolean);

function shrink(file, max, q) {               // 긴 변 max px JPEG data URL 로 줄인다
  return new Promise((ok, no) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = Object.assign(document.createElement('canvas'), { width: Math.round(img.naturalWidth * k), height: Math.round(img.naturalHeight * k) });
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      const out = c.toDataURL('image/jpeg', q); c.width = c.height = 0; ok(out);     // 캔버스 메모리 반납
    };
    img.onerror = () => { URL.revokeObjectURL(url); no(new Error('사진을 읽을 수 없어요.')); };
    img.src = url;
  });
}
const BACKUP_MAX = 20 * 2 ** 20;              // 사진이 없어 작다 — 이보다 큰 파일은 이 앱의 백업이 아니다

  if (behind && !(await reload())) return toast('저장소를 읽지 못해 백업을 만들지 못했어요. 잠시 뒤 다시 해 주세요.', true);      // 다른 창이 고친 것이 빠진 백업을 만들지 않게
  const at = today(), name = `약통-백업-${at}.json`;
  const blob = new Blob([JSON.stringify({ app: 'pillbox', v: 1, at, state: { ...state, backupAt: at }, use: readUse() })], { type: 'application/json' });      // use = 사용 기록(동작 이름·횟수뿐). 가져올 때는 읽지 않는다

  const file = new File([blob], name, { type: 'application/json' });
  let shared = false;
  if (navigator.canShare?.({ files: [file] })) {

    catch (e) { if (e?.name === 'AbortError') return; }      // 공유 창을 닫았으면 백업 안 한 것. 그 밖은 내려받기로
  }
  if (!shared) {
    const url = URL.createObjectURL(blob);
    Object.assign(document.createElement('a'), { href: url, download: name }).click();
    setTimeout(() => URL.revokeObjectURL(url), 6e4);
  }
  state.backupAt = at; save(); render();
  if (dlg.open && dlg.querySelector('[data-pick=backup]')) backupForm();      // 열려 있는 ⋯ 창의 「마지막 백업」도 새로

/* ───────── AI (내 Google Gemini API 무료 키로 이 브라우저에서 바로 호출 — 서버 없음. 이 앱이 밖으로 보내는 곳은 여기 한 곳) ───────── */
// generateContent 를 쓴다(구글은 '레거시지만 계속 지원'). 새 interactions API 는 브라우저가 보낼 수 없는 Api-Revision 헤더(CORS 거절)를 쓴다.
// 무료 등급은 응답 보장이 없어 모델이 한동안 멈추기도 한다 → 앞 모델이 30초 안에 답이 없거나·한도에 걸렸거나·서버 오류·내려갔으면 다음 모델로 다시 보낸다. [모델, 생각 수준 ('' = 모델 기본)]
// ponytail: 모델이 내려가면 이 목록만 바꾼다 — 무료 등급·이미지 입력이 되는 모델로 (aistudio.google.com/docs/pricing). 화장대와 같은 목록
const GEMINI = 'https://generativelanguage.googleapis.com/v1beta/models/';
const MODELS = [['gemini-4-hydrogen', 'LOW'], ['gemini-3.5-flash-lite', '']];
// 저장소 연결이 끊겼으면 idb 가 다시 열도록 한 번 더 읽는다. 끝내 못 읽으면 null ('' = 키 없음 과 구별)
const getKey = () => idb.get('geminiKey').catch(() => idb.get('geminiKey')).then(v => (typeof v === 'string' ? v : ''), () => null);
// 이 기기에 화장대(같은 주소의 IndexedDB 'vanity')가 있나 — 목록을 알려 주는 브라우저에서 목록에 있을 때만 true. 여는 일은 하지 않는다
const vanityHere = () => (indexedDB.databases ? idb.quick(indexedDB.databases()).then(l => l.some(d => d.name === 'vanity'), () => false) : Promise.resolve(false));
// 화장대 저장소의 Gemini 키 읽기 → 문자열('' = 없음), null = 못 읽음. 버전을 주지 않고 열어서 화장대 저장소를 바꾸지 않는다
// ★없는 저장소를 만들거나 버전을 올리면 화장대가 망가진다 — onupgradeneeded 가 불리면(그사이 지워졌다) 그 트랜잭션을 abort 해 아무것도 남기지 않고 그만둔다
function vanityKeyRead() {
  return idb.quick(new Promise((ok, no) => {
    const r = indexedDB.open('vanity');
    r.onupgradeneeded = () => { r.transaction.abort(); };      // abort 하면 onerror 로 간다
    r.onerror = () => no(r.error);
    r.onblocked = () => no(new Error('blocked'));
    r.onsuccess = () => {
      const db = r.result;
      db.onversionchange = () => db.close();   // 읽는 사이 화장대가 버전을 올리거나 지우려 하면 비켜 준다
      try {
        if (!db.objectStoreNames.contains('kv')) { db.close(); return ok(''); }
        const q = db.transaction('kv', 'readonly').objectStore('kv').get('geminiKey');
        q.onsuccess = () => { db.close(); ok(typeof q.result === 'string' ? q.result : ''); };
        q.onerror = () => { db.close(); no(q.error); };
      } catch (e) { db.close(); no(e); }
    };
  })).catch(() => null);
}
// 받을 틀이 거절되면(e.schema — 400 too many states) 예전에 실제로 되던 틀로 한 번 더 묻는다 — 주성분만 못 받고 나머지는 채운다 (틀 하나 때문에 사진 읽기가 통째로 막히지 않게)
async function readItems(photo, key) {
  const parts = [jpeg(photo), { text: '이 사진 속 영양제·건강보조제를 읽어 주세요.' }];
  let err;
  for (let i = schemaFrom; i < ITEM_SCHEMAS.length; i++) {
    try { const r = cleanItems(await askGemini(parts, key, ITEM_PROMPT, ITEM_SCHEMAS[i])); schemaFrom = i; return r; }
    catch (e) { if (!e?.schema) throw e; err = e; }      // 틀 거절이 아니면(키·한도·연결 등) 틀을 바꿔도 같으니 바로 알린다
  }
  throw err;
}
let schemaFrom = 0;                           // 이번에 열어 둔 동안 받아들여진 틀부터 묻는다 — 거절되는 틀로 매번 헛요청을 보내지 않게 (새로 열면 다시 맨 위부터)
const jpeg = photo => ({ inlineData: { mimeType: 'image/jpeg', data: photo.slice(photo.indexOf(',') + 1) } });
// 사용자 글(제품 이름·메모)은 사용자 메시지 쪽(contents)에만 — 지시문(systemInstruction)은 CHECK_PROMPT 그대로
async function checkRoutineAI(key) {
  const ids = state.items.map(p => p.id);     // 보낸 때의 번호 — 기다리는 사이 제품이 늘거나 지워져도 밀리지 않게
  const r = cleanCheck(await askGemini([{ text: routineText(state, today()) }], key, CHECK_PROMPT, CHECK_SCHEMA));
  for (const p of r.points) p.id = ids[p.product - 1] || '';
  return r;
}
async function askGemini(parts, apiKey, prompt, schema) {      // parts = 보낼 사진·글
  let err, tooBig = false;                    // tooBig: 어느 모델이든 받을 틀을 거절했다 — 뒤 모델이 다른 이유(한도 등)로 끝나도 잊지 않는다 (readItems 가 예전 틀로 다시 묻는다)
  for (const [model, think] of MODELS) {
    try { return readGemini(await callGemini(model, think, parts, apiKey, prompt, schema)); }
    catch (e) { if (!e.next) throw e; err = e; tooBig ||= !!e.schema; }      // 키·차단·연결 문제는 다른 모델로 보내도 같으니 바로 알린다
  }
  throw Object.assign(err, { schema: tooBig });
}
async function callGemini(model, think, parts, apiKey, prompt, schema) {
  let res, body;
  const fail = (msg, next) => Object.assign(new Error(msg), { next });
  const ac = new AbortController(), timer = setTimeout(() => ac.abort(), 30e3);      // 30초 넘게 답이 없으면 끊는다
  try {
    res = await fetch(`${GEMINI}${model}:generateContent`, {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-goog-api-key': apiKey },      // 키는 URL 이 아닌 헤더로 — 기록·리퍼러에 남지 않게
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: prompt }] },
        contents: [{ role: 'user', parts }],
        generationConfig: {
          responseMimeType: 'application/json', responseJsonSchema: schema,
          maxOutputTokens: 8192, ...(think ? { thinkingConfig: { thinkingLevel: think } } : {}),      // 답은 JSON 하나 — 생각은 짧게
        },
      }),
      signal: ac.signal,
    });
    body = await res.json().catch(e => { if (e?.name === 'AbortError') throw e; return {}; });
  } catch (e) {
    throw e?.name === 'AbortError' ? fail('응답이 늦어요. 잠시 뒤 다시 해 주세요.', true) : fail('연결하지 못했어요. 인터넷이나 광고 차단 확장 프로그램을 확인해 주세요.', false);
  } finally { clearTimeout(timer); }
  if (!res.ok) {
    const err = body?.error ?? {}, msg = String(err.message ?? ''), why = JSON.stringify(err.details ?? '');
    const gone = res.status === 404 || /limit: 0\b/.test(msg);      // 모델이 내려갔거나 무료에서 빠짐
    const keyIssue = res.status === 401 || res.status === 403 || /API_KEY|REFERRER_BLOCKED|SERVICE_BLOCKED/.test(why);
    // 다음 모델로: 내려감·한도(모델마다 따로)·서버 오류, 그리고 키 문제가 아닌 400 — 요청 형식을 이 모델만 못 받는 경우가 있다
    const next = gone || res.status === 429 || res.status >= 500 || (res.status === 400 && !keyIssue);
    // schema: 받을 틀이 커서 거절됨 — 부른 쪽이 더 작은 틀로 다시 물을 수 있게 표시한다 (readItems)
    throw Object.assign(fail(gone ? '이 AI 모델을 무료로 쓸 수 없게 됐어요. 앱의 모델 설정을 바꿔야 해요.'
      : res.status === 429 ? '무료 사용 한도에 걸렸어요. 잠시 뒤나 내일 다시 해 주세요.'
      : /REFERRER_BLOCKED|SERVICE_BLOCKED/.test(why) ? 'API 키의 웹사이트·API 제한 설정이 이 앱을 막고 있어요. Google Cloud 콘솔에서 확인해 주세요.'
      : res.status === 401 || res.status === 403 || /API_KEY/.test(why) ? 'API 키가 맞지 않아요. ⋯ 메뉴에서 확인해 주세요.'
      : res.status >= 500 ? 'Google 쪽에 잠깐 문제가 있어요. 잠시 뒤 다시 해 주세요.'
      : `요청이 실패했어요 (${res.status}): ${msg.slice(0, 160)}`, next), { schema: res.status === 400 && /too many states|schema/i.test(msg) });
  }
  return body;
}
// generateContent 응답에서 JSON 답을 꺼낸다. 차단·잘림·깨진 답은 알아듣는 말로
function readGemini(r) {
  const c = r?.candidates?.[0];
  if (r?.promptFeedback?.blockReason || /SAFETY|PROHIBITED|BLOCKLIST|SPII/.test(c?.finishReason ?? '')) throw new Error('AI가 이 요청은 답하지 않았어요.');
  const text = (c?.content?.parts ?? []).filter(p => !p.thought && typeof p.text === 'string').map(p => p.text).join('');
  // 답 없이 OTHER·RECITATION 등으로 끝나면 사실상 거절 — 다시 해도 같아서 무료 한도만 쓴다
  if (c && !text && !/^(STOP|MAX_TOKENS)$/.test(c.finishReason ?? '')) throw new Error('AI가 이 요청은 답하지 않았어요.');
  try { return JSON.parse(text); } catch { throw Object.assign(new Error('결과를 읽지 못했어요. 다시 해 주세요.'), { next: true }); }      // 잘리거나 깨진 답은 다른 모델로
}
// 제품 사진 → 첫 제품으로 이 창을 채우고(이미 고른 먹는 때·메모는 그대로), 나머지는 저장할 때마다 하나씩 새 창으로. 사진은 저장하지 않는다
// 같은 창에서 또 찍으면(앞면 다음 뒷면) 이미 채운 칸은 두고 새로 읽은 것만 더한다 — 성분은 합치고, 비어 온 기한·섭취량은 그대로
async function fillFromPhoto(form, file) {
  const out = form.querySelector('.ai'), lock = form.querySelectorAll('[data-pick=item], .primary');
  const live = () => form.isConnected && dlg.open;        // 창을 닫았거나 바뀌었으면 결과는 버린다 (읽는 동안 사진 고르기는 잠가 둔다)
  for (const el of lock) el.disabled = true;
  out.hidden = false;
  try {
    const key = await getKey();
    if (!live()) return;
    if (key === null) return void (out.textContent = '저장소를 읽지 못했어요. 다시 해 주세요.');
    if (!key) return void (out.textContent = '⋯ 메뉴에서 Gemini API 키(무료)를 등록하면 사진으로 채울 수 있어요.');
    out.textContent = 'AI가 사진을 읽는 중이에요… (보통 몇 초)';
    const items = await readItems(await shrink(file, 2048, .85), key);      // 뒷면의 작은 기한 글자도 읽게 크게
    if (!live()) return;
    if (!items.length) return void (out.textContent = '사진에서 제품을 찾지 못했어요. 이름이 보이게 가까이 찍어 주세요.');
    // 이미 등록한 제품의 고치기 창이면 첫 제품만 쓰고(나머지를 새 등록으로 띄우지 않음), 직접 고른 종류도 그대로 둔다
    const it = items[0], cur = readItem(form), editing = !!form.dataset.id;
    if (!editing) queue = [...items.slice(1), ...queue];  // 앞 사진에서 남아 있던 제품은 뒤에 그대로
    const name = cur.name || it.name, kind = cur.kind !== 'etc' && (editing || cur.name) ? cur.kind : it.kind !== 'etc' ? it.kind : cur.kind;
    const expiry = it.expiry || cur.expiry, dose = cur.dose || it.dose;
    itemForm({ ...cur, name, kind, tags: [...new Set([...cur.tags, ...it.tags])], main: cur.main || it.main, stock: cur.stock || it.stock, expiry, dose }, !editing);      // 이미 적어 둔 주성분·섭취량·남은 양은 그대로
    // 실제로 이 창에 들어간 것만 말한다 — 이미 적혀 있어 그대로 둔 주성분·섭취량을 「채웠다」고 하지 않게
    const added = it.tags.filter(t => !cur.tags.includes(t));      // 이번에 새로 체크된 성분
    const found = [!cur.name && it.name && '이름', kind !== cur.kind && '종류', !cur.main && it.main && `주성분 ${it.main}`, it.expiry && it.expiry !== cur.expiry && `유통기한 ${it.expiry}`, !cur.dose && it.dose && `1회 ${it.dose}`,
      !cur.stock && it.stock && `남은 양 ${it.stock}`, added.length && `성분 ${added.map(t => TAGS[t]).join('·')}`].filter(Boolean);
    const o = dlg.querySelector('.ai');
    o.hidden = false;
    // 짧게: 읽은 개수 · 채운 것 · 뒷면 안내(이 창의 기한이나 1회 섭취량 칸이 아직 비어 있을 때만 — 섭취량은 대개 뒷면에 있다. 짐작해서 채우지는 않는다)
    const blank = [!expiry && '기한', !dose && '1회 섭취량'].filter(Boolean);
    o.textContent = (!editing && items.length > 1 ? `${items.length}개를 읽었어요 — 저장하면 다음 것이 떠요. ` : '')
      + (found.length ? `채운 것: ${found.join(' · ')}.` : '새로 채운 것은 없어요.')
      + (blank.length ? ` ${blank.join('·')}은 뒷면을 한 번 더 찍으면 채워요.` : '');
  } catch (e) { if (live()) out.textContent = e.message; }
  finally { for (const el of lock) el.disabled = false; }
}

/* ───────── 동작 ───────── */
// 검토 창의 적용 버튼을 「적용됨」으로 바꾼다 (같은 제품·같은 값을 가리킨 버튼 모두)
const applied = (d, label) => { for (const b of dlg.querySelectorAll(`[data-act="${d.act}"]`)) if (['id', 'memo', 'when'].every(k => b.dataset[k] === d[k])) { b.disabled = true; b.textContent = label; } };
const ACT = {
  tab(d) {
    tab = d.tab;
    // 안내의 「보러 가기」·빈 화면의 버튼: 그 걸러 보기로 바로 — 안내가 말한 제품이 다 보이게 찾던 글은 푼다
    if (Object.hasOwn(d, 'f')) { filter = d.f; query = ''; focusId = 'f-' + d.f; }
    render(); scrollTo(0, 0);
  },
  filter(d) { filter = d.f; render(); },
  tick(d) {                                   // 먹었어요 켜고 끄기. 한 달 지난 체크·빈 날은 이때 치운다
    if (!SLOT_KEYS.includes(d.t) || !date(d.day)) return;
    if (d.day !== today()) { shownDay = today(); render(); return toast('날이 바뀌어 오늘 루틴으로 바꿨어요'); }      // 켜 둔 채 자정을 넘긴 화면 — 어제 날짜에 체크하지 않는다
    const all = state.ticks, s = (all[d.day] ??= Object.fromEntries(SLOT_KEYS.map(t => [t, []])))[d.t], i = s.indexOf(d.id);
    if (i < 0) s.push(d.id); else s.splice(i, 1);
    const p = item(d.id); if (p) spend(p, i < 0 ? -1 : 1);      // 남은 양을 적어 둔 제품이면 한 번 양만큼 줄인다 (체크를 풀면 되돌린다)
    sweepTicks(); commit();
  },
  add() { queue = []; itemForm(); },
  skip() { queue.length ? itemForm(queue.shift(), true) : shut(); },
  editItem(d) {
    const p = item(d.id); if (!p) return;     // 그사이 지워진 제품(다른 창에서 삭제)이면 빈 등록 창을 띄우지 않는다
    checkBack = dlg.open && dlg.querySelector('.check') ? lastCheck : null; stock0 = p.stock; itemForm(p);

  delItem(d) {                                // 다 먹었어요·삭제: 목록과 체크에서 지운다 (따로 기록은 남기지 않는다)
    const p = item(d.id); if (!p || !confirm(`‘${p.name}’을(를) 목록에서 지울까요?`)) return;
    state.items = state.items.filter(x => x !== p);
    for (const k in state.ticks) for (const t of SLOT_KEYS) state.ticks[k][t] = state.ticks[k][t].filter(id => id !== p.id);

  },

    checkForm();

  applyMemo(d) {                              // AI 검토 제안 → 제품 메모에 덧붙인다 (오늘 화면에 📝로 보인다)
    const p = item(d.id); if (!p || !d.memo) return;

    // 다 들어가지 않으면 넣지 않는다 — 잘려 들어가면 「이미 있어요」로 안 바뀌어 누를 때마다 또 덧붙는다
    if (memo.length > 300) return toast('메모가 가득 차서(300자) 넣지 못했어요. 제품을 열어 메모를 정리해 주세요.', true);

  backup() { backupForm(); },
  export() { exportAll().catch(() => toast('백업 파일을 만들지 못했어요', true)); },
  close() { shut(); },
  async saveKey() {
    const v = dlg.querySelector('[name=apiKey]').value.trim();
    if (/^sk-ant-/.test(v) || !/^[\w.-]{20,}$/.test(v)) return toast('Gemini API 키 형식이 아니에요. AI Studio에서 복사한 키를 그대로 넣어 주세요.', true);
    try { await idb.set('geminiKey', v); } catch (e) { return fail(e); }

  },
  async delKey() {
    if (!confirm('이 기기에 저장된 API 키를 지울까요?')) return;

  async vanityKey() {                         // 같은 주소에 있는 화장대의 키를 이 앱 저장소로 옮겨 적는다 (화장대 쪽은 읽기만). 키 값은 끝 4자리만 보인다
    if (!(await vanityHere())) return toast('이 기기에서 화장대를 찾지 못했어요', true);
    const v = await vanityKeyRead();
    if (v === null) return toast('화장대 저장소를 읽지 못했어요. 화장대 탭을 모두 닫고 다시 해 주세요.', true);
    if (!/^[\w.-]{20,}$/.test(v)) return toast('화장대에 넣어 둔 키가 없어요', true);

document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (state && b && Object.hasOwn(ACT, b.dataset.act)) { used(useName(b.dataset)); ACT[b.dataset.act](b.dataset); } });
view.addEventListener('input', e => { if (e.target.id === 'q') { if (!query && e.target.value) used('search'); query = e.target.value; applySearch(); } });      // 찾기 (글자마다 · 사용 기록은 찾기 시작할 때 한 번)

dlg.addEventListener('input', e => {          // 제품 창: 이름으로 종류·성분 추측, 먹는 때 안내
  const t = e.target, f = t.form;
  if (f?.dataset.form !== 'item') return;
  const el = f.elements;
  if (t.name === 'name' && f.dataset.auto) { const g = guess(t.value); el.kind.value = g.kind; for (const c of el.tags) c.checked = g.tags.includes(c.value); }
  if (t.name === 'kind' || t.name === 'tags') delete f.dataset.auto;        // 직접 고른 뒤에는 추측하지 않는다
  const cur = readItem(f);
  f.querySelector('.autonote').textContent = autoNote(cur);
  f.querySelector('.stocknote').textContent = stockNote(cur);
});
dlg.addEventListener('change', e => {         // 사진·백업 파일 고르기
  const t = e.target, file = t.files?.[0];
  if (!file) return;
  if (t.dataset.pick) used('pick:' + t.dataset.pick);      // backup · item
  if (t.dataset.pick === 'backup') importFile(file);
  if (t.dataset.pick === 'item') fillFromPhoto(t.form, file);
  t.value = '';                               // 못 읽었을 때 같은 파일을 다시 고를 수 있게
});
// Esc·뒤로 가기로 닫을 때도 검토 창으로 돌아온다 (shut). 브라우저가 막기를 받아 주지 않아 그대로 닫혔으면 돌아갈 답을 남기지 않는다
// 창 자신의 이벤트만 본다 — 사진 고르기를 취소해도 그 입력 칸에서 cancel 이 올라온다(크롬 113+)
dlg.addEventListener('cancel', e => { if (e.target === dlg && checkBack) { e.preventDefault(); shut(); } });
dlg.addEventListener('close', e => { if (e.target === dlg && !dlg.open) checkBack = null; });
dlg.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.dataset.form) used('form:' + f.dataset.form + (f.dataset.form === 'item' ? (f.dataset.id ? ':edit' : ':new') : ''));      // 사용 기록: 저장을 누른 횟수
  let added = null;                           // 이번에 새로 등록한 제품 (맨 아래: 화면에 안 나오면 알림)
  if (f.dataset.form === 'item') {
    const p = readItem(f);
    if (!p.name) return;
    const i = state.items.findIndex(x => x.id === p.id);
    if (f.dataset.id && i < 0) { shut(); return toast('다른 창에서 지운 제품이에요', true); }      // 고치기 창을 연 사이 지워졌으면 되살리지 않는다
    if (i >= 0 && p.stock === stock0) p.stock = state.items[i].stock;      // 남은 양 칸을 안 고쳤으면 지금 값 그대로 — 창을 열어 둔 사이 다른 창의 ✓ 로 줄었을 수 있다
    i < 0 ? state.items.push(p) : (state.items[i] = p);
    if (!f.dataset.id && queue.length) { itemForm(queue.shift(), true); toast(`‘${p.name}’ 저장했어요`); return void commit(); }      // 사진에서 읽은 다음 제품
    if (!f.dataset.id) added = p;
  } else if (e.submitter?.name === 'saveKey') return ACT.saveKey();      // 「키 저장」 또는 키 칸에서 Enter
  else return shut();
  shut();
  commit();
  // 새로 등록한 제품이 지금 화면에 안 나오면(오늘 화면, 다른 걸러 보기·찾는 글) 등록됐다고 알린다 — 안 된 줄 알고 한 번 더 넣지 않게
  const card = added && document.getElementById('p-' + added.id);
  if (added && (!card || card.closest('[hidden]'))) toast(`‘${added.name}’을(를) 등록했어요`);
});

// 폰은 다음 날 탭을 다시 열어도 페이지를 새로 불러오지 않고 되살리기만 한다 → 날이 바뀌었으면 오늘 기준으로 다시 그린다
function refresh() {
  if (document.hidden || !state || shownDay === today()) return;
  shownDay = today(); render();
}
// 다른 창이 저장했거나 이 창이 다시 보이면 저장소의 최신 내용으로 바꾼다 (못 읽었던 상태면 건드리지 않음)
// 읽었으면 true(바뀐 것이 없어도), 못 읽었으면 false — 못 읽은 동안은 저장이 옛 내용으로 나가지 않게 behind 를 세운다 (save)
async function reload() {
  if (noSave || !state) return true;
  try {
    const saved = await idb.get(STATE_KEY), s = JSON.stringify(saved);
    behind = false;
    // 바뀐 게 없으면 다시 그리지 않는다 — 폰은 사진 고르기에서 돌아오면 이게 먼저 돌아서, 다시 그리면 입력 칸이 바뀐다
    if (saved == null || s === seen) return true;
    seen = s; state = cleanState(saved);
    render();
    return true;
  } catch { behind = true; return false; }     // 저장소가 응답하지 않거나(다른 탭이 붙잡고 있음) 읽기 오류
}
// 숨은 탭은 읽지 않고 표시만 해 둔다 — 다시 보일 때 읽는다 (숨은 채 저장소를 쓰다 얼면 다른 탭의 저장을 막는다). 보이는 탭도 다 읽기 전까지는 behind — 그사이 저장이 옛 내용으로 나가지 않게
bc?.addEventListener('message', () => { behind = true; if (!document.hidden) reload(); });
// 이 앱이 열린 탭·창마다 'pillbox-open' 을 같이(shared) 쥐고 있는다 — 다른 곳에도 열려 있는지 세어서 알려 주려고. 얼어 있는 탭도 쥔 채라 세어진다 (저장을 막는 것이 바로 그런 탭이다)
const opened = navigator.locks && location.search !== '?test' ? new Promise(ok => navigator.locks.request('pillbox-open', { mode: 'shared' }, () => (ok(), new Promise(() => {}))).catch(ok)) : null;
opened?.catch(() => {});
async function twins() {
  if (!opened) return;
  try {
    await opened;                             // 내 것이 잡힌 뒤에 센다
    const { held = [] } = await navigator.locks.query();
    document.getElementById('twin').hidden = new Set(held.filter(l => l.name === 'pillbox-open').map(l => l.clientId)).size < 2;
  } catch {}
}
// 3초 뒤 한 번 더 세는 것은 새로고침 직후엔 앞 문서가 쥐던 것이 아직 안 풀려 잘못 세기도 해서. 날짜 넘김(refresh)은 못 읽었어도 한다
// 다시 읽었는데 화면에만 있고 저장 안 된 변경이 남아 있으면(저장소가 막혀 저장을 포기했던 것) 이때 저장한다 — 안 그러면 ✓ 가 보이는데 탭을 닫으면 사라진다
const wake = () => (usedToday(), twins(), setTimeout(twins, 3000), reload().then(ok => {
  refresh();
  if (ok && !noSave && state && !document.hidden && JSON.stringify(state) !== seen) save();
}));
// 숨을 때: 연결을 놓고 behind 를 세운다 — 숨은 사이 다른 창이 저장한 알림을 놓쳤을 수 있다(얼었거나 뒤로 가기 보관). 다시 보여 다 읽기 전의 저장이 옛 내용으로 덮어쓰지 않게 (save 가 먼저 다시 읽는다)
const away = () => { behind = true; idb.rest(); };
document.addEventListener('visibilitychange', () => { if (document.hidden) away(); else wake(); });
addEventListener('pageshow', () => document.hidden || wake());
addEventListener('pagehide', away);
document.addEventListener('freeze', away);      // 폰이 탭을 얼리기 직전
setInterval(() => document.hidden || twins(), 60e3);

/* ───────── 자체 점검: index.html?test ───────── */
function selfTest() {
  const out = [], ok = (c, m) => out.push([!!c, m]), eq = (a, b, m) => ok(JSON.stringify(a) === JSON.stringify(b), `${m} → ${JSON.stringify(a)}`);
  eq([addMonths('2026-01-31', 1), addMonths('2024-01-31', 1), date('2026-02-30'), date('2026-02-28'), addDays('2026-12-31', 1)], ['2026-02-28', '2024-02-29', '', '2026-02-28', '2027-01-01'], '날짜 도우미: 말일·윤년·없는 날짜·해 넘김');

    [{ kind: 'probiotic' }, 'wake', '① 유산균 종류 → 아침 공복'], [{ kind: 'multi', tags: ['probiotic', 'iron'] }, 'wake', '① 유산균 든 종합비타민 → 아침 공복 (유산균이 먼저)'],

    [{ kind: 'vitamin', tags: ['c', 'zinc'] }, 'noon', '⑨ 비타민C → 점심 식후 (아연보다 먼저)'],

  // 숨은 채 열렸으면(뒤에서 연 탭) 보일 때까지 저장소를 건드리지 않는다
  if (document.hidden) await new Promise(ok => document.addEventListener('visibilitychange', function f() { if (!document.hidden) { document.removeEventListener('visibilitychange', f); ok(); } }));
  try {
    const saved = await idb.get(STATE_KEY).catch(() => idb.get(STATE_KEY));      // 연결이 끊겼으면 idb 가 다시 열어 한 번 더
    state = cleanState(saved); seen = JSON.stringify(saved);
  } catch {
    state = cleanState(); lost(true);         // 알림 줄(#lost)이 새로고침 전까지 떠 있다
  }
  shownDay = today();
  render();
  navigator.storage?.persist?.().catch(() => {});      // 브라우저가 임의로 비우지 않게 요청 (거절돼도 동작)
  navigator.serviceWorker?.register('sw.js').catch(() => {});   // 인터넷 없이도 열리게 (sw.js)
  usedToday();
  twins(); setTimeout(twins, 3000);
})();
</script>
